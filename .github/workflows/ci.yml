name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt -p meson-app -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: cargo clippy (SSR)
        run: cargo clippy -p meson-app --features ssr --all-targets -- -D warnings -A clippy::pedantic -A clippy::nursery

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: cargo check SSR
        run: cargo check -p meson-app --features ssr
      - name: cargo check hydrate wasm
        run: cargo check -p meson-app --features hydrate --target wasm32-unknown-unknown

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo test (SSR)
        run: cargo test -p meson-app --features ssr -- --test-threads=1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meson-uf-app-e2e/end2end/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: meson-uf-app-e2e/end2end
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright (run-lanes.sh)
        working-directory: meson-uf-app-e2e/end2end
        env:
          LANES: "4"
        run: ./run-lanes.sh --no-install
      - name: Upload lane output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lanes-out
          path: meson-uf-app-e2e/end2end/lanes-out/
          if-no-files-found: ignore
