# Settings for run-lanes.sh. Paths are relative to the repo root.
BUILD_CMD="cargo leptos build --project meson-uf-app-e2e"   # as in ci.yml
PROFILE=debug
SERVER_BIN=meson-uf-app-e2e          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=meson-uf-app-e2e/site
OUTPUT_NAME=meson-uf-app-e2e
PORT=3220                          # lane i serves on PORT + 100 + i
READY_PATH=/health
SERVER_ENV=""
LANE_ENV=""                        # {port} is replaced with the lane's port
LANES_DEFAULT=1
